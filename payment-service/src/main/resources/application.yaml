spring:
  application:
    name: payment-service

  datasource:
    username: root
    password: root
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mediclaimx_dbs
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    config:
          enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true



server:
  port: 8083
